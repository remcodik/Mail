services:
  - type: web
    name: mailai
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false          # paste contents of credentials.json
      - key: GOOGLE_TOKEN_JSON
        sync: false          # paste token JSON after first /auth/login
      - key: SECRET_KEY
        generateValue: true  # auto-generated by Render
