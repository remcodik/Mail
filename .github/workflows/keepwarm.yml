name: Keep MailAI warm

# Pings the live app so Render's free instance doesn't spin down (which would
# cost a ~30s cold start on next open). Free: runs on GitHub's schedule.
# Note: GitHub cron is best-effort and can drift by 10+ min under load; if you
# want a rock-solid interval, add a free UptimeRobot/cron-job.org monitor hitting
# the same /api/health URL every 5 min instead (or in addition).

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # allow a manual "Run workflow" click

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.KEEPWARM_URL || 'https://mailai-remco.onrender.com/api/health' }}
        run: |
          echo "Pinging $URL"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "health check did not return 200 (app may still be waking) — not failing the run"
          exit 0
