name: Keep MailAI warm

# Pings the live app so Render's free instance doesn't spin down (which would
# cost a ~30-60s cold start on the next open — Render free sleeps after ~15 min
# idle).
#
# Why this shape: GitHub's scheduler heavily THROTTLES frequent crons — a
# "*/10" every-10-min schedule realistically fires only once every 1-3 hours on
# a quiet repo, which is far too sparse to keep a 15-min-idle instance awake.
# So instead we schedule HOURLY (throttled far less) and, within one run,
# self-loop: ping every 5 minutes for ~55 minutes. That keeps the app awake
# continuously between the hourly triggers.
#
# NOTE: even this depends on GitHub firing the hourly schedule roughly on time;
# it can still drift. For a rock-solid keep-alive, add a free external monitor
# (cron-job.org or UptimeRobot) hitting the same /api/health URL every 5 min —
# see docs/SETUP.md. The only zero-gap fix is a paid Render instance (no sleep).

on:
  schedule:
    - cron: "0 * * * *"       # hourly (throttled far less than */10)
  workflow_dispatch:          # allow a manual "Run workflow" click

# Don't stack runs: if an hourly run is still looping when the next fires, skip.
concurrency:
  group: keepwarm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ping health endpoint every 5 minutes for ~55 minutes
        env:
          URL: ${{ vars.KEEPWARM_URL || 'https://mailai-remco.onrender.com/api/health' }}
        run: |
          echo "Keeping $URL warm — pinging every 5 min for ~55 min"
          for round in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "$(date -u +%H:%M:%S) round $round -> HTTP $code"
            # last round: don't sleep, just finish
            if [ "$round" -lt 12 ]; then sleep 300; fi
          done
          echo "done — next hourly run picks up from here"
