<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1BC2B4"/>
      <stop offset="0.55" stop-color="#12A99C"/>
      <stop offset="1" stop-color="#0A7C72"/>
    </linearGradient>
    <linearGradient id="tileU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#E23B4E"/></linearGradient>
    <linearGradient id="tileR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#2C63E6"/></linearGradient>
    <linearGradient id="tileD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6B23C"/><stop offset="1" stop-color="#E68A17"/></linearGradient>
    <linearGradient id="tileT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C7BFF"/><stop offset="1" stop-color="#6E45E6"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#053f39" flood-opacity="0.28"/>
    </filter>
    <filter id="sp" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7a4b00" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- app background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="470" cy="180" rx="680" ry="360" fill="#ffffff" opacity="0.10"/>

  <!-- cockpit panel (glass card) -->
  <g filter="url(#sh)">
    <rect x="176" y="212" width="672" height="600" rx="70" fill="#ffffff"/>
  </g>

  <!-- header row: title bar + two summary pills -->
  <rect x="232" y="270" width="250" height="34" rx="17" fill="#0FA398" opacity="0.85"/>
  <rect x="232" y="322" width="150" height="22" rx="11" fill="#0FA398" opacity="0.25"/>

  <!-- 2x2 grid of cockpit tiles -->
  <!-- Urgent -->
  <g>
    <rect x="232" y="386" width="252" height="184" rx="34" fill="url(#tileU)"/>
    <circle cx="278" cy="432" r="20" fill="#ffffff" opacity="0.92"/>
    <rect x="252" y="500" width="150" height="20" rx="10" fill="#ffffff" opacity="0.85"/>
    <rect x="252" y="532" width="96" height="16" rx="8" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- Reply -->
  <g>
    <rect x="540" y="386" width="252" height="184" rx="34" fill="url(#tileR)"/>
    <circle cx="586" cy="432" r="20" fill="#ffffff" opacity="0.92"/>
    <rect x="560" y="500" width="150" height="20" rx="10" fill="#ffffff" opacity="0.85"/>
    <rect x="560" y="532" width="96" height="16" rx="8" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- Delivery -->
  <g>
    <rect x="232" y="596" width="252" height="184" rx="34" fill="url(#tileD)"/>
    <circle cx="278" cy="642" r="20" fill="#ffffff" opacity="0.92"/>
    <rect x="252" y="710" width="150" height="20" rx="10" fill="#ffffff" opacity="0.85"/>
    <rect x="252" y="742" width="96" height="16" rx="8" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- Travel -->
  <g>
    <rect x="540" y="596" width="252" height="184" rx="34" fill="url(#tileT)"/>
    <circle cx="586" cy="642" r="20" fill="#ffffff" opacity="0.92"/>
    <rect x="560" y="710" width="150" height="20" rx="10" fill="#ffffff" opacity="0.85"/>
    <rect x="560" y="742" width="96" height="16" rx="8" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- AI sparkle brand, top-right over the panel -->
  <g filter="url(#sp)">
    <path d="M792 150 C806 220 830 244 900 258 C830 272 806 296 792 366 C778 296 754 272 684 258 C754 244 778 220 792 150 Z" fill="#FFD36B"/>
    <path d="M690 120 C696 152 707 163 739 169 C707 175 696 186 690 218 C684 186 673 175 641 169 C673 163 684 152 690 120 Z" fill="#FFE7A6"/>
  </g>
</svg>
